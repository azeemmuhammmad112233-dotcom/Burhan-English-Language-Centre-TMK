<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply — Burhan English</title>
  <link rel="stylesheet" href="public/style.css" />
  <style>
    .brand-mark img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
  </style>
</head>
<body>

  <div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="wm-stage">
      <div class="wm-row wm-row-1"><span>APPLY</span><span>APPLY</span></div>
      <div class="wm-row wm-row-2"><span>JOIN US</span><span>JOIN US</span></div>
    </div>
    <div class="bg-vignette"></div>
  </div>

  <header class="site-header">
    <div class="container">
      <nav class="nav-bar">
        <a href="index.html" class="brand">
          <span class="brand-mark"><img src="burhan logo - Copy.jpeg" alt="Logo" width="40" height="40"></span>
          <span>Burhan English</span>
        </a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="courses.html">Courses</a>
          <a href="faculty.html">Faculty</a>
          <a href="contact.html">Contact</a>
          <a href="apply.html" class="is-cta active">Apply Now</a>
          <a href="login.html" style="background: var(--emerald-500); color: white; border-radius: 999px; padding: 0.6rem 1.2rem;">Portal Login</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero" style="padding-bottom: 2rem;">
      <div class="container">
        <span class="page-eyebrow">Admissions</span>
        <h1>Start your <span class="text-gradient">application</span></h1>
        <p>Fill in the form below. Our team will contact you within one working day.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="form-card">
          <form id="applyForm">
            <div class="form-row">
              <div class="form-group">
                <label>First Name *</label>
                <input type="text" id="aFirstName" required placeholder="John" />
              </div>
              <div class="form-group">
                <label>Last Name *</label>
                <input type="text" id="aLastName" required placeholder="Doe" />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Email *</label>
                <input type="email" id="aEmail" required placeholder="john@example.com" />
              </div>
              <div class="form-group">
                <label>Phone *</label>
                <input type="tel" id="aPhone" required placeholder="+92 300 0000000" />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Select Course *</label>
                <select id="aCourse" required>
                  <option value="">Choose a course...</option>
                  <option value="spoken">Spoken English Foundations</option>
                  <option value="ielts">IELTS Preparation</option>
                  <option value="business">Business English</option>
                </select>
              </div>
              <div class="form-group">
                <label>Preferred Batch *</label>
                <select id="aBatch" required>
                  <option value="">Choose a batch...</option>
                  <option value="morning">Morning (9:00 - 12:00)</option>
                  <option value="evening">Evening (6:00 - 9:00)</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label>Upload ID / Document *</label>
              <input type="file" id="aDoc" required style="padding: 0.8rem;" />
            </div>

            <button type="submit" class="btn btn-shine" style="width:100%; margin-top:1rem;" id="submitBtn">
              Submit Application
            </button>
            <div id="formMsg" style="margin-top:1rem; text-align:center; font-weight:600; display:none;"></div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.getElementById('applyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('formMsg');
      
      btn.textContent = 'Submitting...';
      btn.disabled = true;

      const formData = new FormData();
      formData.append('firstName', document.getElementById('aFirstName').value);
      formData.append('lastName', document.getElementById('aLastName').value);
      formData.append('email', document.getElementById('aEmail').value);
      formData.append('phone', document.getElementById('aPhone').value);
      formData.append('course', document.getElementById('aCourse').value);
      formData.append('batch', document.getElementById('aBatch').value);
      
      const file = document.getElementById('aDoc').files[0];
      if(file) formData.append('document', file);

      try {
        const res = await fetch('/api/apply', { method: 'POST', body: formData });
        if(res.ok) {
          msg.style.display = 'block';
          msg.style.color = 'var(--emerald-400)';
          msg.textContent = 'Application submitted successfully! We will contact you soon.';
          document.getElementById('applyForm').reset();
        } else {
          throw new Error('Failed');
        }
      } catch (err) {
        msg.style.display = 'block';
        msg.style.color = '#ff6b6b';
        msg.textContent = 'Something went wrong. Please try again.';
      } finally {
        btn.textContent = 'Submit Application';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
